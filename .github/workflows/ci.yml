name: CI

on:
  push:
    branches: [main, master, develop, '**']
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libcunit1-dev pkg-config

      - name: Build
        run: make all

      - name: Test
        env:
          HELI_SQL_DIR: ${{ github.workspace }}/sql
          HELI_SEED: "1"
        run: make test
