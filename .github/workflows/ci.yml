name: CI

on:
  push:
    branches: [main, master, develop, '**']
  pull_request:
    branches: [main, master, develop]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev libcunit1-dev pkg-config gcovr

      - name: Build and test with coverage
        env:
          HELI_SQL_DIR: ${{ github.workspace }}/sql
          HELI_SEED: "1"
        run: |
          make clean
          make test \
            CXXFLAGS="-std=c++17 -Wall -Wextra -O0 -g -Iincludes --coverage" \
            LDFLAGS="-lsqlite3 --coverage"

      - name: Generate coverage.xml
        run: |
          gcovr -r . --xml-pretty -o coverage.xml \
            --exclude "tests/.*" \
            --exclude "build/.*"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
